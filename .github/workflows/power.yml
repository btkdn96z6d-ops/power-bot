{
  "name": "compliments",
  "on": {
    "schedule": [{ "cron": "0 7 * * *" }],
    "workflow_dispatch": {
      "inputs": {
        "text": { "description": "Свій текст (необов'язково)", "required": false }
      }
    }
  },
  "jobs": {
    "send": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        {
          "name": "Send compliment",
          "run": "python3 compliment_bot.py",
          "env": {
            "TELEGRAM_TOKEN": "${{ secrets.TELEGRAM_TOKEN }}",
            "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "CUSTOM_TEXT": "${{ inputs.text }}"
          }
        }
      ]
    }
  }
}
